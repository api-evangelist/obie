  seismic.com and exposes no standalone developer portal, API, documentation, or
  /.well-known discovery surface — security.txt, openid-configuration, api-catalog and
  llms.txt all return 404, and no api/developer/docs/app subdomains resolve. The product
  appears to have been wound down or absorbed into Seismic's sales-enablement platform;
  the domain's mail infrastructure (DMARC/SPF) still references tasytt.com, Obie's parent.
